services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TAGASAY_PORT: "8080"
      TAGASAY_DATA: "/data/store.json"
      TAGASAY_BOT_DATA: "/data/bots"
      TAGASAY_ENV: "production"
      TAGASAY_BOT_TOKEN_KEY: "${TAGASAY_BOT_TOKEN_KEY:?TAGASAY_BOT_TOKEN_KEY is required in production}"
    volumes:
      - relaydata:/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tagasay
      POSTGRES_USER: tagasay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - relay

volumes:
  relaydata:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
