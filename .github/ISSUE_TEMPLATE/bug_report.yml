name: Bug report
description: Сообщить об ошибке в TAGa-Say
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте секреты, ключи и приватную переписку. Уязвимости — через SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло и что ожидалось?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: TECNO KL6, Android 14
  - type: input
    id: version
    attributes:
      label: Версия приложения
      placeholder: 0.1.0-alpha
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Удалите из логов персональные данные.
      render: shell
